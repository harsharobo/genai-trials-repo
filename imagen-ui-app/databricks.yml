bundle:
  name: imagen-app-bundle

variables:
  serving_endpoint_name:
    description: "Name of the model serving endpoint to be used by the app"
    # TODO: uncomment the line below and specify a default value to avoid needing to specify it on each deployment
    default: "qwen_image_edit_model"
  resource_name_suffix:
    description: "Suffix for resource names (app/lakebase instance names etc). Helpful for avoiding name collisions if multiple users deploy this app to the same workspace"
    default: "shj"

resources:
  apps:
    databricks_ui_app:
      # NOTE: customize the app name here, if desired
      name: imagen-app-${var.resource_name_suffix}
      description: "Image editing app using multimodel model endpoints deployed on Databricks"
      source_code_path: .
      resources:
        - name: serving-endpoint
          description: "Databricks serving endpoint name for the model used by the app"
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: secret
          description: "secret to access the model serving endpoint api key"
          secret:
            scope: shj_scope
            key: db_secret
            permission: READ

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      root_path: /Users/sriharsha.jana@databricks.com/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      root_path: /Users/sriharsha.jana@databricks.com/.bundle/${bundle.name}/${bundle.target}
