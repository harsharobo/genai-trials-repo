bundle:
  name: multimodal-model-bundle

variables:
  # Define any bundle-level variables here, if needed.
  # These can be overridden per target below.
  environment_name:
    description: "The target environment name (e.g., dev, stage, prod)."
    default: "dev"
  schema_name:
    description: "The target schema name for the agent."
    default: "default"
  catalog_name:
    description: "The target catalog name for the agent."
    default: "uc_sriharsha_jana"
  notification_email:
    description: "Email address for job failure notifications."
    default: "sriharsha.jana@databricks.com"

include:
  - resources/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    # We use 'mode: development' to indicate this is a personal development copy:
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default
    # - The 'development' mode is used for Delta Live Tables pipelines
    mode: development
    default: true
    variables:
      environment_name: "dev"
      schema_name: "default"
      catalog_name: "uc_sriharsha_jana"
      notification_email: "sriharsha.jana@databricks.com"
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

  ## Optionally, there could be a 'staging' target here.
  ## (See Databricks docs on CI/CD at https://docs.databricks.com/dev-tools/bundles/ci-cd.html.)
  #
  # staging:
  #   workspace:
  #     host: https://adb-984752964297111.11.azuredatabricks.net

  # The 'prod' target, used for production deployment.
  prod:
    # We use 'mode: production' to indicate this is a production deployment.
    # Doing so enables strict verification of the settings below.
    mode: production
    variables:
      environment_name: "prod"
      schema_name: "default"
      catalog_name: "uc_sriharsha_jana"
      notification_email: "sriharsha.jana@databricks.com"
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      # We always use /Users/sriharsha.jana@databricks.com for all resources to make sure we only have a single copy.
      # If this path results in an error, please make sure you have a recent version of the CLI installed.
      root_path: /Users/sriharsha.jana@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as sriharsha.jana@databricks.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: sriharsha.jana@databricks.com